<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <title>My Page</title>
  <style>div { font-family: sans-serif; padding: 20px; }</style>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <h1>Hello from an SVG</h1>
      <button id="b">Click me</button>
    </div>
  </foreignObject>
  <script><![CDATA[
    document.getElementById('b').onclick = () => alert('it works');
  ]]></script>
</svg>
